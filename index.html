<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="icon" href="img/">
    <link rel="stylesheet" href="style.css">
    <!-- Basic Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<!-- Filled Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
<!-- Brand Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>
<body>
    <div class="hero-section">
        <div class="overlay-black">
            <div class="nav-bar">
            <div class="nav-element">
                <img src="img/logo.svg" alt="">
                <div class="right-nav">
                    <span class="language">
                    <i class="bx bx-translate icon"></i>
                    <h3>English</h3>
                    <i class="bxf bx-caret-big-down icon-down"></i>
                    </span>
                    <button class="sign-in">Sign In</button>
                </div>
            </div>
            <div class="arc"></div>
        </div>
        <div class="hero-content">
            <h1>Unlimited movies, shows, and more</h1>
            <h3>Starts at &#8377;149. Cancel at any time.</h3>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <div class="get-started">
                <input type="email" placeholder="Email address">
                <button>Get Started <i class="bx bx-chevron-right"></i></button>
            </div>
        </div>
        </div>
        
    </div>
    <div class="section-2">
        <div class="part-1">
        </div>
        <div class="part-2">
            
        </div>
    </div>
</body>
</html>
